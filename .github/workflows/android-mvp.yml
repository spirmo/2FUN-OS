name: Android MVP Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Android Release Signing
        working-directory: apps/mobile/android
        run: |
          mkdir -p app/keystore

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/twofun-release-key.jks

          cat > key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/keystore/twofun-release-key.jks
          EOF

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Clean project
        working-directory: apps/mobile
        run: flutter clean

      - name: Generate Build Number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Show Build Number
        run: echo "GitHub Build Number = $BUILD_NUMBER"

      - name: Show pubspec Version
        working-directory: apps/mobile
        run: grep "^version:" pubspec.yaml

      - name: Build User APK
        working-directory: apps/mobile
        run: |
          flutter build apk \
            --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=GOVERNANCE_BUILD=false \
            --dart-define=DIAGNOSTIC_API_URL=https://api.2fun.global

      - name: Show User APK Version
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-name apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-code apps/mobile/build/app/outputs/flutter-apk/app-release.apk


      - name: Check APK Signature
        run: |
          APK="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner"
          EXPECTED_SHA256="125a67191002655167ce52d199ce476da3b3482c6e44148428947a81fdf74bb9"

          "$APKSIGNER" verify --print-certs "$APK"

          ACTUAL_SHA256=$(
            "$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/.*certificate SHA-256 digest: //p' |
            tr -d '[:space:]'
          )

          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual SHA-256:   $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signature does not match the trusted 2FUN release certificate."
            exit 1
          fi

          echo "APK signature verified successfully."

      - name: Show User APK Info
        run: |
          ls -lh apps/mobile/build/app/outputs/flutter-apk/


      - name: Save User APK
        run: |
          mv apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
             apps/mobile/build/app/outputs/flutter-apk/app-user-release.apk

      - name: Build Governance APK
        working-directory: apps/mobile
        run: |
          flutter build apk \
            --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=GOVERNANCE_BUILD=true \
            --dart-define=DIAGNOSTIC_API_URL=https://api.2fun.global

      - name: Show Governance APK Version
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-name apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-code apps/mobile/build/app/outputs/flutter-apk/app-release.apk


      - name: Check APK Signature
        run: |
          APK="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner"
          EXPECTED_SHA256="125a67191002655167ce52d199ce476da3b3482c6e44148428947a81fdf74bb9"

          "$APKSIGNER" verify --print-certs "$APK"

          ACTUAL_SHA256=$(
            "$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/.*certificate SHA-256 digest: //p' |
            tr -d '[:space:]'
          )

          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual SHA-256:   $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signature does not match the trusted 2FUN release certificate."
            exit 1
          fi

          echo "APK signature verified successfully."

      - name: Show Governance APK Info
        run: |
          ls -lh apps/mobile/build/app/outputs/flutter-apk/

      - name: Save Governance APK
        run: |
          mv apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
             apps/mobile/build/app/outputs/flutter-apk/app-governance-release.apk

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: twofun-user-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-user-release.apk

      - name: Upload Governance APK
        uses: actions/upload-artifact@v4
        with:
          name: twofun-governance-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-governance-release.apk
